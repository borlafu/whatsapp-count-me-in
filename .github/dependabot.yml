version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # The Node pin is bumped by hand together with .nvmrc (CI checks they match).
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  # Without this, action versions are never bumped. That is how the deploy
  # workflow ended up warning on every run that actions/github-script@v7
  # targets the deprecated Node.js 20 runtime.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
