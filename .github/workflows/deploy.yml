name: Continuous Deployment

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Deployment
        id: deployment
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
            });
            return data.id;

      - name: Deploy to Oracle VM via SSH
        id: ssh
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # `set -e` replaces the script_stop input, which was removed in
            # ssh-action v1.2.1. Without it a failing command mid-script is
            # ignored and the step still reports success, which would hide a
            # partial deploy: dependencies swapped but never built or reloaded.
            set -e
            if [ ! -d "$HOME/.nvm" ]; then
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.4/install.sh | bash
            fi
            export NVM_DIR="$HOME/.nvm"
            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              echo "nvm.sh missing after install" >&2
              exit 1
            fi
            \. "$NVM_DIR/nvm.sh"
            cd ~/whatsapp-count-me-in
            git fetch origin main
            git reset --hard origin/main
            nvm install
            nvm use

            # pm2 and pnpm are both pinned and both reinstalled only when the
            # pin and the installed version disagree, so a redeploy is a no-op
            # but a bumped pin is followed. Pinning pm2 keeps production from
            # drifting onto whatever pm2@latest happens to be that day.
            PM2_VERSION=7.1.1
            PM2_REINSTALLED=0
            if [ "$(pm2 --version 2>/dev/null)" != "$PM2_VERSION" ]; then
              npm install -g "pm2@$PM2_VERSION"
              PM2_REINSTALLED=1
            fi

            # Node 26 no longer bundles corepack, so install the pinned pnpm
            # directly. `.split('@').pop()` tolerates the integrity suffix
            # corepack writes into packageManager ("pnpm@1.2.3+sha512.…"),
            # which is not a version npm can resolve.
            PNPM_VERSION="$(node -p "require('./package.json').packageManager.split('@').pop().split('+')[0]")"
            [ "$(pnpm --version 2>/dev/null)" = "$PNPM_VERSION" ] || npm install -g "pnpm@$PNPM_VERSION"

            CI=true pnpm install --frozen-lockfile
            pnpm run build

            # The pm2 daemon keeps running under whichever Node and whichever
            # pm2 spawned it, so after either is bumped the CLI and the daemon
            # disagree. `pm2 update` fixes that, but it kills the daemon and
            # resurrects every app, so it must not run on an ordinary deploy,
            # where only `pm2 reload` restarts the bot. When pm2 was reinstalled
            # or the daemon's Node differs, `pm2 update` resurrects the app and
            # the reload below restarts it once more: two restarts, expected
            # once per Node/pm2 bump. Compare the daemon's interpreter to decide.
            DAEMON_NODE=""
            if [ -f "$HOME/.pm2/pm2.pid" ]; then
              DAEMON_NODE="$(readlink -f "/proc/$(cat "$HOME/.pm2/pm2.pid")/exe" 2>/dev/null || true)"
            fi
            PM2_RESPAWNED=0
            if [ "$PM2_REINSTALLED" = 1 ] || { [ -n "$DAEMON_NODE" ] && [ "$DAEMON_NODE" != "$(readlink -f "$(command -v node)")" ]; }; then
              echo "Respawning the pm2 daemon on $(node -v) (was: ${DAEMON_NODE:-not running})"
              # Time-boxed: `pm2 update` can hang from non-interactive scripts
              # (Unitech/pm2#5000); a timeout falls through to the warning.
              # The flag is set only on success, so a failed update does not
              # make the systemd refresh below claim a respawn on this Node.
              if timeout 120 pm2 update; then
                PM2_RESPAWNED=1
              else
                echo "::warning::pm2 update failed; pm2 reload will start the app"
              fi
            fi

            pm2 reload ecosystem.config.cjs --update-env
            pm2 save
            # `pm2 startup` bakes the Node bin path into the systemd unit, so
            # after a Node bump a reboot would launch pm2 with the old binary,
            # which nvm may eventually remove. Needed when pm2 was reinstalled
            # or the daemon respawned, and also whenever the existing unit does
            # not mention the active Node's bin dir, so a refresh that failed
            # on an earlier deploy (no sudo) is retried. Needs passwordless sudo.
            # By this point the app is already built, reloaded and saved, so
            # neither a missing sudo nor a sudoers rule that refuses this
            # command may fail the deploy: both only cost a stale boot unit,
            # and both must stay loud in the log.
            if [ "$PM2_RESPAWNED" = 1 ] || ! systemctl cat "pm2-$(id -un)" 2>/dev/null | grep -qF "$(dirname "$(readlink -f "$(command -v node)")")"; then
              if sudo -n env PATH="$PATH" "$(command -v pm2)" startup systemd -u "$(id -un)" --hp "$HOME"; then
                echo "pm2 systemd unit refreshed for $(node -v)"
              else
                echo "::warning::ACTION REQUIRED: run 'pm2 startup' with sudo on the VM to refresh the systemd unit for $(node -v)"
              fi
            fi

            # Moved last so a failed deploy leaves the default Node untouched.
            # nvm gives every exact Node version its own prefix, so globally
            # installed packages do not carry over: every .nvmrc bump
            # reinstalls pm2 and triggers one `pm2 update` above. Without the
            # alias a plain SSH session or a reboot would still land on the
            # previous version. Everything above uses `nvm use`, not the alias.
            nvm alias default "$(cat .nvmrc)"

      - name: Update Deployment Status
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: '${{ steps.ssh.outcome }}' === 'success' ? 'success' : 'failure',
              environment: 'production',
            });
