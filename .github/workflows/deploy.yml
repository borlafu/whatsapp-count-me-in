name: Continuous Deployment

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
            });
            return data.id;

      - name: Deploy to Oracle VM via SSH
        id: ssh
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # `set -e` replaces the script_stop input, which was removed in
            # ssh-action v1.2.1. Without it a failing command mid-script is
            # ignored and the step still reports success, which would hide a
            # partial deploy: dependencies swapped but never built or reloaded.
            set -e
            if [ ! -d "$HOME/.nvm" ]; then
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.4/install.sh | bash
            fi
            export NVM_DIR="$HOME/.nvm"
            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              echo "nvm.sh missing after install" >&2
              exit 1
            fi
            \. "$NVM_DIR/nvm.sh"
            cd ~/whatsapp-count-me-in
            git fetch origin main
            git reset --hard origin/main
            nvm install
            nvm use
            corepack enable
            CI=true pnpm install --frozen-lockfile
            pnpm run build
            pm2 reload ecosystem.config.cjs --update-env

      - name: Update Deployment Status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: '${{ steps.ssh.outcome }}' === 'success' ? 'success' : 'failure',
              environment: 'production',
            });
