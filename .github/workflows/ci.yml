name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Enable corepack before setup-node so the pnpm cache lookup can resolve
      # the store path from the packageManager field in package.json.
      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # No compiler toolchain is installed on purpose. The deploy target has no
      # C++ toolchain either, so a dependency that needs one must fail here
      # rather than at deploy time.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm run build

      - name: Run tests
        run: pnpm test
