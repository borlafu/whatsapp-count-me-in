name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Node 26 no longer bundles corepack, so pnpm comes from this action,
      # which reads the pinned version from the packageManager field in
      # package.json. It still has to run before setup-node so the pnpm cache
      # lookup can resolve the store path.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # No compiler toolchain is installed on purpose. The deploy target has no
      # C++ toolchain either, so a dependency that needs one must fail here
      # rather than at deploy time.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm run build

      - name: Run tests
        run: pnpm test
