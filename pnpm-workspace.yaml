auditConfig:
  ignoreCves: []

allowBuilds:
  '@whiskeysockets/baileys': true
  # v13+ ships N-API prebuilt binaries, so no compile step is needed. The
  # package still contains binding.gyp, which makes pnpm inject an implicit
  # `node-gyp rebuild` (upstream's `gypfile: false` is not honoured), and that
  # fails on hosts without a C++ toolchain. Must be an explicit `false`:
  # omitting the entry raises ERR_PNPM_IGNORED_BUILDS and fails the install.
  better-sqlite3: false
  esbuild: true
  protobufjs: true
  sharp: true
